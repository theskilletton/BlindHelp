<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lecteur de fiches</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: #000; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; }
  #zone { position: fixed; inset: 0; width: 100%; height: 100%; padding: 0; border: 0; background: #000; }
  #video { width: 100%; height: 100%; object-fit: cover; }
  #statut { position: fixed; left: 0; right: 0; bottom: 0; max-height: 40vh; overflow: hidden;
            padding: 1.2rem; font-size: 1.5rem; text-align: center; background: rgba(0,0,0,.8);
            pointer-events: none; white-space: pre-wrap; }
  #reglages { position: fixed; top: 0; left: 0; right: 0; z-index: 2; padding: .8rem; background: #111; font-size: 1.1rem; }
  #reglages label { display: block; margin-top: .8rem; }
  #reglages input, #reglages textarea { width: 100%; margin-top: .3rem; font-size: 1rem; }
  #reglages button { margin-top: .8rem; padding: .6rem 1.2rem; font-size: 1.1rem; }
</style>
</head>
<body>

<button id="zone" aria-label="Toucher l'écran pour photographier la fiche">
  <video id="video" autoplay playsinline muted></video>
</button>

<div id="statut" role="status">Chargement…</div>

<details id="reglages">
  <summary>⚙️ Réglages</summary>
  <label>Clé API Gemini
    <input id="cle" type="password" autocomplete="off" placeholder="AIza…">
  </label>
  <label>Vitesse de lecture : <span id="vitesseVal"></span>
    <input id="vitesse" type="range" min="0.3" max="2" step="0.1">
  </label>
  <label>Prompt envoyé avec la photo
    <textarea id="prompt" rows="8"></textarea>
  </label>
  <button id="tester" type="button">Tester la voix</button>
  <button id="sauver" type="button">Enregistrer</button>
</details>

<input id="fichier" type="file" accept="image/*" capture="environment" hidden>
<canvas id="canvas" hidden></canvas>

<script>
// ===================== CONFIGURATION =====================
const PROMPT_PAR_DEFAUT = `Tu aides un élève malvoyant. Voici la photo d'une fiche d'exercices.
Pour chaque exercice, lis d'abord l'énoncé, puis donne la résolution étape par étape avec la réponse finale.
Ta réponse sera lue à voix haute par une synthèse vocale, donc :
- écris uniquement du texte brut : pas de markdown, pas d'astérisques, pas de titres, pas de tableaux, pas d'emojis ;
- écris les formules en toutes lettres, par exemple « x au carré plus 3 x égale 7 » ;
- fais des phrases courtes et annonce chaque exercice, par exemple « Exercice 1 ».
Si la photo est floue, coupée ou illisible, dis-le en une phrase et demande de reprendre la photo.`;

// Modèles essayés dans l'ordre. Google renomme souvent ses modèles :
// si tous échouent, regarde les noms disponibles dans Google AI Studio et ajoute-les ici.
const MODELES = ["gemini-flash-latest", "gemini-flash-lite-latest", "gemini-2.5-flash", "gemini-2.5-flash-lite"];

const TAILLE_MAX = 1600;    // px, côté le plus long de l'image envoyée (plus léger = plus rapide)
const QUALITE_JPEG = 0.85;

// ===================== OUTILS =====================
const $ = id => document.getElementById(id);
const lire = (k, defaut) => { try { return localStorage.getItem(k) ?? defaut; } catch { return defaut; } };
const ecrire = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const statut = txt => { $("statut").textContent = txt; };
const messagePret = () => flux ? "Touchez l'écran pour photographier la fiche."
                               : "Touchez l'écran pour ouvrir l'appareil photo.";

let etat = "pret";        // "pret" | "analyse" | "lecture"
let flux = null;          // flux de la caméra intégrée à la page
let finLecture = null;    // permet d'interrompre la lecture

// ===================== RÉGLAGES =====================
$("cle").value = lire("cle", "");
$("vitesse").value = lire("vitesse", "1");
$("prompt").value = lire("prompt", PROMPT_PAR_DEFAUT);
const majVitesse = () => { $("vitesseVal").textContent = "x" + $("vitesse").value; };
$("vitesse").oninput = majVitesse;
majVitesse();

$("tester").onclick = () => parler("Voici la vitesse de lecture choisie.");
$("sauver").onclick = () => {
  ecrire("cle", $("cle").value.trim());
  ecrire("vitesse", $("vitesse").value);
  ecrire("prompt", $("prompt").value);
  $("reglages").open = false;
  parler("Réglages enregistrés.");
};
if (!lire("cle", "")) $("reglages").open = true;   // premier lancement : ouvrir les réglages

// ===================== VOIX =====================
let voixFr = null;
function choisirVoix() {
  const voix = speechSynthesis.getVoices();
  voixFr = voix.find(v => v.lang === "fr-FR" && v.localService)
        || voix.find(v => v.lang.startsWith("fr")) || null;
}
choisirVoix();
speechSynthesis.onvoiceschanged = choisirVoix;

// Chrome coupe les énoncés trop longs (~15 s) : on lit le texte phrase par phrase.
function decouper(texte) {
  const morceaux = [];
  for (let phrase of texte.split(/(?<=[.!?])\s+|\n+/)) {
    phrase = phrase.trim();
    while (phrase.length > 200) {
      let coupe = phrase.lastIndexOf(" ", 200);
      if (coupe < 50) coupe = 200;
      morceaux.push(phrase.slice(0, coupe));
      phrase = phrase.slice(coupe).trim();
    }
    if (phrase) morceaux.push(phrase);
  }
  return morceaux;
}

function parler(texte) {
  return new Promise(resolve => {
    finLecture = resolve;
    const morceaux = decouper(texte);
    if (!morceaux.length) return resolve();
    morceaux.forEach((m, i) => {
      const u = new SpeechSynthesisUtterance(m);
      u.lang = "fr-FR";
      if (voixFr) u.voice = voixFr;
      u.rate = parseFloat($("vitesse").value);   // 1 = normal, 0.5 = deux fois plus lent
      if (i === morceaux.length - 1) u.onend = u.onerror = () => resolve();
      speechSynthesis.speak(u);
    });
  });
}

// Retire le formatage que la synthèse vocale lirait mal
function nettoyer(texte) {
  return texte
    .replace(/[*#`$]/g, "")
    .replace(/^\s*>\s?/gm, "")
    .replace(/^\s*[-•]\s+/gm, "");
}

// ===================== CAMÉRA / IMAGE =====================
async function demarrerCamera() {
  try {
    flux = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    $("video").srcObject = flux;
  } catch {
    flux = null;   // caméra refusée ou pas de HTTPS → on utilisera l'appareil photo du téléphone
  }
  statut(messagePret());
}

function versJpeg(source, largeur, hauteur) {
  const echelle = Math.min(1, TAILLE_MAX / Math.max(largeur, hauteur));
  const c = $("canvas");
  c.width = Math.round(largeur * echelle);
  c.height = Math.round(hauteur * echelle);
  c.getContext("2d").drawImage(source, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", QUALITE_JPEG).split(",")[1];   // base64 sans l'en-tête
}

async function fichierVersJpeg(fichier) {
  const img = new Image();
  img.src = URL.createObjectURL(fichier);
  await img.decode().catch(() => { throw new Error("Impossible de lire la photo."); });
  const b64 = versJpeg(img, img.naturalWidth, img.naturalHeight);
  URL.revokeObjectURL(img.src);
  return b64;
}

// ===================== IA (Gemini) =====================
async function demanderIA(imageB64) {
  const cle = lire("cle", "");
  if (!cle) throw new Error("Aucune clé API enregistrée. Ouvrez les réglages en haut de l'écran.");

  const corps = JSON.stringify({
    contents: [{ parts: [
      { text: lire("prompt", PROMPT_PAR_DEFAUT) },
      { inline_data: { mime_type: "image/jpeg", data: imageB64 } }
    ]}]
  });

  // On commence par le dernier modèle qui a fonctionné, puis on essaie les autres
  const modeles = [...new Set([lire("modele", ""), ...MODELES].filter(Boolean))];
  let codeErreur = 0;

  for (const modele of modeles) {
    let rep;
    try {
      rep = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/${modele}:generateContent`,
        { method: "POST", headers: { "Content-Type": "application/json", "x-goog-api-key": cle }, body: corps }
      );
    } catch {
      throw new Error("Pas de connexion internet.");
    }

    if (rep.ok) {
      const data = await rep.json();
      const texte = (data.candidates?.[0]?.content?.parts ?? [])
        .filter(p => !p.thought).map(p => p.text ?? "").join("").trim();
      if (!texte) throw new Error("L'IA n'a renvoyé aucune réponse. Reprenez la photo.");
      ecrire("modele", modele);
      return texte;
    }

    codeErreur = rep.status;
    console.warn(modele, rep.status, await rep.text());
    // 404 = modèle inexistant, 429 = quota épuisé, 5xx = serveur surchargé → on tente le suivant
    if (![404, 429, 500, 503].includes(rep.status)) break;
  }

  if (codeErreur === 400 || codeErreur === 403) throw new Error("La clé API semble invalide. Vérifiez-la dans les réglages.");
  if (codeErreur === 429) throw new Error("Quota gratuit atteint. Réessayez dans une minute.");
  throw new Error(`Le service d'IA ne répond pas, erreur ${codeErreur}.`);
}

// ===================== DÉROULEMENT =====================
async function traiter(obtenirImage) {
  etat = "analyse";
  statut("Analyse en cours…");
  parler("Photo prise. Analyse en cours, patientez.");   // appelé pendant le toucher : débloque la voix
  let verrou = null;
  try {
    const image = await obtenirImage();
    try { verrou = await navigator.wakeLock?.request("screen"); } catch {}   // l'écran reste allumé
    const reponse = nettoyer(await demanderIA(image));
    statut(reponse);
    etat = "lecture";
    await parler(reponse);
  } catch (e) {
    statut(e.message);
    etat = "lecture";
    await parler(e.message);
  } finally {
    verrou?.release();
    etat = "pret";
    statut(messagePret());
  }
}

$("zone").onclick = () => {
  if (etat === "lecture") {          // toucher pendant la lecture = arrêter
    speechSynthesis.cancel();
    finLecture?.();
    return;
  }
  if (etat !== "pret") return;       // analyse en cours : on ignore

  const video = $("video");
  if (flux && video.videoWidth) {
    traiter(() => versJpeg(video, video.videoWidth, video.videoHeight));
  } else {
    parler("Ouverture de l'appareil photo.");   // débloque la voix (iPhone notamment)
    $("fichier").click();
  }
};

$("fichier").onchange = () => {
  const f = $("fichier").files[0];
  $("fichier").value = "";
  if (f) traiter(() => fichierVersJpeg(f));
};

// Si le téléphone a mis la page en veille, on relance la caméra au retour
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && flux?.getVideoTracks()[0]?.readyState === "ended") demarrerCamera();
});

demarrerCamera();
</script>
</body>
</html>
